<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Carbon Footprint Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <div class="nav-logo">🌿 Carbon Footprint Tracker</div>
    <div class="nav-links">
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </div>
</nav>

<div class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-title">
            <h1>🌿 Carbon Footprint Tracker</h1>
            <p>Join us and start tracking your household carbon emissions</p>
        </div>
        <div class="card">
            <h2>Create Account</h2>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm" placeholder="Confirm your password">
                </div>
                <div class="form-group">
                    <label>Household Size</label>
                    <input type="number" name="size" placeholder="Number of people in household">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" name="location" placeholder="Enter your location">
                </div>
                <button type="submit" class="btn btn-green btn-full">Register</button>
            </form>
            <div class="link-text">
                Already have an account? <a href="/login">Login here</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
