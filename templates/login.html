<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Carbon Footprint Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav>
    <div class="nav-logo">🌿 Carbon Footprint Tracker</div>
    <div class="nav-links">
        <a href="/login">Login</a>
        <a href="/register">Register</a>
    </div>
</nav>

<div class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-title">
            <h1>🌿 Carbon Footprint Tracker</h1>
            <p>Track your household emissions and help achieve net-zero targets</p>
        </div>
        <div class="card">
            <h2>Login</h2>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-green btn-full">Login</button>
            </form>
            <div class="link-text">
                Don't have an account? <a href="/register">Register here</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
